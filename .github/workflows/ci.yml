name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check lua tests

  no-debug-calls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: reject leftover dd() calls
        run: |
          if grep -rnP '^(?!\s*--).*\bdd\(' lua tests; then
            echo "dd() is a debug call; remove it before merging."
            exit 1
          fi

  # macOS and Windows are in the matrix because this configuration is written
  # on Linux and nothing here had ever run anywhere else. The screens are not:
  # a terminal on another platform draws its own way, and a golden frame is a
  # statement about one terminal. What these check is the half that is
  # platform behaviour rather than drawing --- paths, separators, shells, the
  # standard directories --- which is where the portability defects were found
  # by reading.
  #
  # Every step runs under bash, which the Windows runners have as Git Bash.
  # The scripts are bash and the point is to exercise the configuration, not
  # to rewrite the harness in PowerShell.
  specs:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        neovim: [stable, nightly]
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}
      - uses: actions/cache@v4
        with:
          path: .tests
          key: tests-${{ matrix.os }}-${{ matrix.neovim }}-${{ hashFiles('lazy-lock.json', 'tests/minit.lua') }}
      - run: ./scripts/test

  boot:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        neovim: [stable, nightly]
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}
      # Under runner.temp rather than the workspace: the configuration is put
      # where Neovim looks for it by copying the checkout, and copying a
      # directory into itself does not end.
      - name: install plugins at the pinned commits
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/ci/config
          XDG_DATA_HOME: ${{ runner.temp }}/ci/data
          XDG_STATE_HOME: ${{ runner.temp }}/ci/state
          NVIM_APPNAME: nvim-ci
        run: |
          mkdir -p "$XDG_CONFIG_HOME"
          # A symlink needs developer mode on Windows, and a copy is the same
          # thing to an editor reading files.
          ln -s "$GITHUB_WORKSPACE" "$XDG_CONFIG_HOME/nvim-ci" 2>/dev/null ||
            cp -r "$GITHUB_WORKSPACE" "$XDG_CONFIG_HOME/nvim-ci"
          nvim --headless "+Lazy! restore" +qa
      - name: start and report health
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/ci/config
          XDG_DATA_HOME: ${{ runner.temp }}/ci/data
          XDG_STATE_HOME: ${{ runner.temp }}/ci/state
          NVIM_APPNAME: nvim-ci
        run: |
          nvim --headless "+checkhealth dotfiles" "+w! health.log" +qa
          cat health.log
          if grep -q '^ *- ERROR' health.log; then
            echo "checkhealth dotfiles reported an error."
            exit 1
          fi
